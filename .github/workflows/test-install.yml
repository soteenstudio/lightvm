name: Test Package Installation

on:
  workflow_dispatch:

jobs:
    test:
      name: Test (${{ matrix.platform }} / ${{ matrix.target }})
      runs-on: ${{ matrix.os }}
      
      strategy:
        fail-fast: false
        matrix:
          include:
            # --- 64-BIT VARIANTS ---
            - os: ubuntu-latest
              target: x86_64-unknown-linux-gnu
              platform: linux-x64
            - os: windows-latest
              target: x86_64-pc-windows-msvc
              platform: win32-x64
            - os: macos-latest
              target: x86_64-apple-darwin
              platform: darwin-x64
            - os: ubuntu-latest
              target: aarch64-linux-android
              platform: android-arm64
  
            # --- ARM64 LINUX (NEW) ---
            - os: ubuntu-latest
              target: aarch64-unknown-linux-gnu
              platform: linux-arm64
            - os: ubuntu-latest
              target: aarch64-unknown-linux-musl
              platform: linux-musl-arm64
  
            # --- 32-BIT VARIANTS ---
            - os: ubuntu-latest
              target: i686-unknown-linux-gnu
              platform: linux-ia32
            - os: windows-latest
              target: i686-pc-windows-msvc
              platform: win32-ia32
            - os: ubuntu-latest
              target: armv7-linux-androideabi
              platform: android-arm
  
            # --- LINUX MUSL (ALPINE) ---
            - os: ubuntu-latest
              target: x86_64-unknown-linux-musl
              platform: linux-musl-x64
            - os: ubuntu-latest
              target: i686-unknown-linux-musl
              platform: linux-musl-ia32
  
            # --- BSD FAMILY ---
            - os: ubuntu-latest
              target: x86_64-unknown-freebsd
              platform: freebsd-x64

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Environment / Install Package
          run: npm i lightvm
            
        - name: Verify Installation
          run: npm run testing:ts
