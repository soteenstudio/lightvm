name: Release (RC & Stable)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Type
        id: rel_type
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title_prefix=Release Candidate" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title_prefix=Stable Release" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust / Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary
        run: cargo build --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.LIGHTVM_PAT }}
          tag_name: ${{ github.ref_name }}
          name: "LightVM ${{ steps.rel_type.outputs.title_prefix }} ${{ github.ref_name }}"
          prerelease: ${{ steps.rel_type.outputs.is_prerelease == 'true' }}
          generate_release_notes: ${{ steps.rel_type.outputs.is_prerelease == 'false' }}
          body: |
            ${{ steps.rel_type.outputs.is_prerelease == 'true' && '⚠️ **This is a Release Candidate build for testing.**' || '🚀 **Official Stable Release!**' }}
          files: |
            target/release/lightvm
